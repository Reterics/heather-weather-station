[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heather-weather-station"
version = "1.0.0"
description = "Conditions API and field dashboard for humidity, weather, sunlight, and terrain height at a coordinate."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
heather = "heather.__main__:main"

[tool.setuptools.packages.find]
include = ["heather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
